
services:
  postgres:
    image: postgres:17-alpine
    container_name: bloom-filter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bloom_user
      POSTGRES_PASSWORD: bloom_password
      POSTGRES_DB: bloom_filter_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloom_user -d bloom_filter_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bloom-filter-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: bloom-filter-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://bloom_user:bloom_password@postgres:5432/bloom_filter_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BLOOM_FILTER_BIT_SIZE: 958506
      BLOOM_FILTER_HASH_COUNT: 7
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
