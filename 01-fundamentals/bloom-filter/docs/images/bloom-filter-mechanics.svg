<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
<title id="title">Bloom Filter mechanics</title><desc id="desc">Two insertions set overlapping positions in a 12-bit array. An absent candidate happens to map to set bits, illustrating a possible false positive.</desc>
<rect width="960" height="340" rx="18" fill="#f5f8fc"/><text x="30" y="40" font-family="Arial" font-size="22" font-weight="700" fill="#172b4d">How insertions share bits</text><text x="30" y="67" font-family="Arial" font-size="14" fill="#526579">Illustrative example: each value maps to three positions in the same bitmap.</text>
<text x="30" y="119" font-family="Arial" font-size="15" font-weight="700" fill="#17324d">username A</text><text x="30" y="177" font-family="Arial" font-size="15" font-weight="700" fill="#17324d">username B</text><text x="30" y="235" font-family="Arial" font-size="15" font-weight="700" fill="#17324d">absent C</text>
<g font-family="Arial" font-size="13" text-anchor="middle"><g fill="#fff" stroke="#8ea2b7"><rect x="170" y="89" width="52" height="42"/><rect x="222" y="89" width="52" height="42"/><rect x="274" y="89" width="52" height="42"/><rect x="326" y="89" width="52" height="42"/><rect x="378" y="89" width="52" height="42"/><rect x="430" y="89" width="52" height="42"/><rect x="482" y="89" width="52" height="42"/><rect x="534" y="89" width="52" height="42"/><rect x="586" y="89" width="52" height="42"/><rect x="638" y="89" width="52" height="42"/><rect x="690" y="89" width="52" height="42"/><rect x="742" y="89" width="52" height="42"/></g><g fill="#526579"><text x="196" y="115">0</text><text x="248" y="115">1</text><text x="300" y="115">2</text><text x="352" y="115">3</text><text x="404" y="115">4</text><text x="456" y="115">5</text><text x="508" y="115">6</text><text x="560" y="115">7</text><text x="612" y="115">8</text><text x="664" y="115">9</text><text x="716" y="115">10</text><text x="768" y="115">11</text></g></g>
<path d="M248 132V146H404V132M508 132V146H716V132" fill="none" stroke="#477b9f" stroke-width="2"/><text x="820" y="150" font-family="Arial" font-size="13" fill="#477b9f">A sets 1, 4, 6</text>
<path d="M300 132V164H508V132M612 132V164H716V132" fill="none" stroke="#68a486" stroke-width="2"/><text x="820" y="180" font-family="Arial" font-size="13" fill="#397258">B sets 2, 6, 8</text>
<g font-family="Arial" font-size="13" text-anchor="middle"><rect x="170" y="195" width="52" height="42" fill="#fff" stroke="#8ea2b7"/><rect x="222" y="195" width="52" height="42" fill="#c9e7d7" stroke="#68a486"/><rect x="274" y="195" width="52" height="42" fill="#c9e7d7" stroke="#68a486"/><rect x="326" y="195" width="52" height="42" fill="#fff" stroke="#8ea2b7"/><rect x="378" y="195" width="52" height="42" fill="#c9e7d7" stroke="#68a486"/><rect x="430" y="195" width="52" height="42" fill="#fff" stroke="#8ea2b7"/><rect x="482" y="195" width="52" height="42" fill="#c9e7d7" stroke="#68a486"/><rect x="534" y="195" width="52" height="42" fill="#fff" stroke="#8ea2b7"/><rect x="586" y="195" width="52" height="42" fill="#c9e7d7" stroke="#68a486"/><rect x="638" y="195" width="52" height="42" fill="#fff" stroke="#8ea2b7"/><rect x="690" y="195" width="52" height="42" fill="#fff" stroke="#8ea2b7"/><rect x="742" y="195" width="52" height="42" fill="#fff" stroke="#8ea2b7"/><text x="196" y="222">0</text><text x="248" y="222">1</text><text x="300" y="222">1</text><text x="352" y="222">0</text><text x="404" y="222">1</text><text x="456" y="222">0</text><text x="508" y="222">1</text><text x="560" y="222">0</text><text x="612" y="222">1</text><text x="664" y="222">0</text><text x="716" y="222">0</text><text x="768" y="222">0</text></g>
<path d="M248 239V258H508V239M612 239V258H716V239" fill="none" stroke="#d19a42" stroke-width="2" stroke-dasharray="5 3"/><rect x="170" y="270" width="626" height="48" rx="9" fill="#fff0d9" stroke="#d19a42"/><text x="483" y="291" text-anchor="middle" font-family="Arial" font-weight="700" font-size="14" fill="#815316">If C maps to positions 1, 6, 8, all bits are set</text><text x="483" y="309" text-anchor="middle" font-family="Arial" font-size="12" fill="#715d3b">Possible false positive: C was never inserted, but the filter says “might exist.”</text></svg>
