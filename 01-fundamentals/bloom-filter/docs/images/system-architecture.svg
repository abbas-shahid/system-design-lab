<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Bloom Filter system architecture</title><desc id="desc">Client calls NestJS Users module. It uses Redis Bloom Filter for lookup and Prisma to PostgreSQL for authoritative checks and writes. A batch rebuild reads PostgreSQL and writes Redis.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#526579"/></marker></defs><rect width="960" height="420" rx="18" fill="#f5f8fc"/><text x="30" y="42" font-family="Arial" font-size="22" font-weight="700" fill="#172b4d">Runtime components and data paths</text>
<g font-family="Arial" text-anchor="middle"><rect x="42" y="150" width="135" height="68" rx="12" fill="#e4f1ff" stroke="#5b8db8"/><text x="109" y="180" font-size="16" font-weight="700" fill="#17324d">Client</text><text x="109" y="201" font-size="12" fill="#526579">HTTP request</text>
<rect x="238" y="135" width="184" height="100" rx="12" fill="#fff" stroke="#97a9ba"/><text x="330" y="167" font-size="16" font-weight="700" fill="#17324d">NestJS API</text><text x="330" y="190" font-size="13" fill="#526579">UsersController / Service</text><text x="330" y="211" font-size="12" fill="#526579">validation and orchestration</text>
<rect x="510" y="76" width="190" height="82" rx="12" fill="#eef4ff" stroke="#7d91bb"/><text x="605" y="108" font-size="16" font-weight="700" fill="#263c6a">Bloom Filter service</text><text x="605" y="132" font-size="13" fill="#526579">hash + bit operations</text>
<rect x="765" y="76" width="150" height="82" rx="12" fill="#fff0d9" stroke="#d19a42"/><text x="840" y="108" font-size="16" font-weight="700" fill="#815316">Redis</text><text x="840" y="132" font-size="13" fill="#715d3b">bitmap + metadata</text>
<rect x="510" y="255" width="190" height="82" rx="12" fill="#f1f4f7" stroke="#8798a8"/><text x="605" y="287" font-size="16" font-weight="700" fill="#17324d">Prisma</text><text x="605" y="311" font-size="13" fill="#526579">database client</text>
<rect x="765" y="255" width="150" height="82" rx="12" fill="#e4f3ea" stroke="#68a486"/><text x="840" y="287" font-size="16" font-weight="700" fill="#176348">PostgreSQL</text><text x="840" y="311" font-size="13" fill="#3d6553">users + unique index</text>
<rect x="280" y="300" width="150" height="62" rx="10" fill="#fff" stroke="#97a9ba"/><text x="355" y="326" font-size="14" font-weight="700" fill="#17324d">Rebuild script</text><text x="355" y="346" font-size="12" fill="#526579">cursor batches</text></g>
<g fill="none" stroke="#526579" stroke-width="2" marker-end="url(#ar)"><path d="M177 184H232"/><path d="M422 160L500 124"/><path d="M700 117H757"/><path d="M422 210L500 280"/><path d="M700 296H757"/><path d="M430 329H752"/><path d="M430 315L757 147"/></g>
<g font-family="Arial" font-size="12" fill="#526579"><text x="442" y="133">membership</text><text x="440" y="260">verify / persist</text><text x="555" y="350">read users</text><text x="574" y="206">write bitmap</text></g>
<text x="38" y="395" font-family="Arial" font-size="12" fill="#526579">Database checks and signup writes go through Prisma. The filter is an index; PostgreSQL enforces uniqueness.</text></svg>
