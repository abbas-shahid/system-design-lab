<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
<title id="title">Signup flow</title><desc id="desc">Request validation precedes database insert. The unique constraint may reject a duplicate. Successful inserts are then added to the Redis Bloom Filter; failures trigger invalidation attempt while signup remains successful.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#526579"/></marker></defs><rect width="960" height="430" rx="18" fill="#f5f8fc"/><text x="28" y="40" font-family="Arial" font-size="22" font-weight="700" fill="#172b4d">POST /api/v1/users</text>
<g font-family="Arial" text-anchor="middle"><rect x="45" y="105" width="155" height="68" rx="11" fill="#e4f1ff" stroke="#5b8db8"/><text x="122" y="132" font-size="15" font-weight="700" fill="#17324d">Client</text><text x="122" y="153" font-size="12" fill="#526579">username JSON</text>
<rect x="270" y="105" width="180" height="68" rx="11" fill="#fff" stroke="#97a9ba"/><text x="360" y="132" font-size="15" font-weight="700" fill="#17324d">ValidationPipe</text><text x="360" y="153" font-size="12" fill="#526579">DTO rules</text>
<rect x="520" y="105" width="190" height="68" rx="11" fill="#e4f3ea" stroke="#68a486"/><text x="615" y="132" font-size="15" font-weight="700" fill="#176348">PostgreSQL insert</text><text x="615" y="153" font-size="12" fill="#3d6553">unique username index</text>
<rect x="755" y="105" width="160" height="68" rx="11" fill="#fff0d9" stroke="#d19a42"/><text x="835" y="132" font-size="15" font-weight="700" fill="#815316">Redis bitmap</text><text x="835" y="153" font-size="12" fill="#715d3b">add username bits</text>
<rect x="270" y="270" width="180" height="62" rx="10" fill="#fce9e7" stroke="#d18178"/><text x="360" y="296" font-size="14" font-weight="700" fill="#8a3530">Invalid input</text><text x="360" y="316" font-size="12" fill="#8a3530">HTTP 400</text>
<rect x="520" y="270" width="190" height="62" rx="10" fill="#fce9e7" stroke="#d18178"/><text x="615" y="296" font-size="14" font-weight="700" fill="#8a3530">Duplicate key (P2002)</text><text x="615" y="316" font-size="12" fill="#8a3530">HTTP 409</text>
<rect x="755" y="270" width="160" height="62" rx="10" fill="#fff0d9" stroke="#d19a42"/><text x="835" y="296" font-size="14" font-weight="700" fill="#815316">Update error</text><text x="835" y="316" font-size="12" fill="#715d3b">try invalidate metadata</text>
<rect x="320" y="365" width="480" height="45" rx="10" fill="#e4f3ea" stroke="#68a486"/><text x="560" y="393" font-family="Arial" text-anchor="middle" font-size="14" font-weight="700" fill="#176348">HTTP 201 + created database user (even if Redis update failed)</text></g>
<g fill="none" stroke="#526579" stroke-width="2" marker-end="url(#ar)"><path d="M200 139H263"/><path d="M450 139H513"/><path d="M710 139H748"/><path d="M360 173V263"/><path d="M615 173V263"/><path d="M835 173V263"/><path d="M835 332V357"/><path d="M615 173L650 357"/></g>
<g font-family="Arial" font-size="12" fill="#526579"><text x="455" y="124">valid</text><text x="622" y="230">unique violation</text><text x="850" y="230">after insert</text></g></svg>
