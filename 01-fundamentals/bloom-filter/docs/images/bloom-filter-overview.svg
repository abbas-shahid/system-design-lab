<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
<title id="title">Bloom Filter overview</title><desc id="desc">Elements pass through hash positions into a shared bit array. A query returns definitely absent or might exist.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#526579"/></marker></defs>
<rect width="960" height="300" rx="18" fill="#f5f8fc"/><text x="32" y="42" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#172b4d">Bloom Filter: compact membership index</text>
<rect x="34" y="94" width="150" height="58" rx="10" fill="#e4f1ff" stroke="#5b8db8"/><text x="109" y="119" text-anchor="middle" font-family="Arial" font-size="15" fill="#17324d">Input value</text><text x="109" y="139" text-anchor="middle" font-family="Arial" font-size="13" fill="#526579">username</text>
<path d="M184 123H235" stroke="#526579" stroke-width="2" marker-end="url(#a)"/><rect x="244" y="82" width="204" height="82" rx="10" fill="#fff" stroke="#97a9ba"/><text x="346" y="108" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#17324d">SHA-256 double hashing</text><text x="346" y="132" text-anchor="middle" font-family="Arial" font-size="13" fill="#526579">derive k positions</text><text x="346" y="151" text-anchor="middle" font-family="Arial" font-size="12" fill="#526579">h(i) = (h₁ + i·h₂) mod m</text>
<path d="M448 123H500" stroke="#526579" stroke-width="2" marker-end="url(#a)"/><text x="526" y="76" font-family="Arial" font-size="14" font-weight="700" fill="#17324d">Redis bit array</text>
<g font-family="Arial" font-size="13" text-anchor="middle"><rect x="505" y="91" width="54" height="45" rx="5" fill="#fff" stroke="#8ea2b7"/><rect x="559" y="91" width="54" height="45" rx="5" fill="#c9e7d7" stroke="#68a486"/><rect x="613" y="91" width="54" height="45" rx="5" fill="#fff" stroke="#8ea2b7"/><rect x="667" y="91" width="54" height="45" rx="5" fill="#c9e7d7" stroke="#68a486"/><rect x="721" y="91" width="54" height="45" rx="5" fill="#fff" stroke="#8ea2b7"/><rect x="775" y="91" width="54" height="45" rx="5" fill="#c9e7d7" stroke="#68a486"/><rect x="829" y="91" width="54" height="45" rx="5" fill="#fff" stroke="#8ea2b7"/><text x="532" y="119" fill="#526579">0</text><text x="586" y="119" fill="#176348">1</text><text x="640" y="119" fill="#526579">0</text><text x="694" y="119" fill="#176348">1</text><text x="748" y="119" fill="#526579">0</text><text x="802" y="119" fill="#176348">1</text><text x="856" y="119" fill="#526579">0</text></g>
<path d="M532 140V168H586V140M640 140V168H694V140M748 140V168H802V140" fill="none" stroke="#477b9f" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="60" y="207" width="390" height="58" rx="10" fill="#e4f3ea" stroke="#69a486"/><text x="255" y="232" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#176348">At least one required bit is 0</text><text x="255" y="252" text-anchor="middle" font-family="Arial" font-size="13" fill="#3d6553">Definitely absent → may skip database lookup</text>
<rect x="510" y="207" width="390" height="58" rx="10" fill="#fff0d9" stroke="#d19a42"/><text x="705" y="232" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#815316">All required bits are 1</text><text x="705" y="252" text-anchor="middle" font-family="Arial" font-size="13" fill="#715d3b">Might exist → verify in PostgreSQL</text></svg>
