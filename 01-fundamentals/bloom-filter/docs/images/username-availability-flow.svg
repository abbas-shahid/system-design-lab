<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">Username availability flow</title><desc id="desc">Availability request checks filter readiness. Unready or Redis error falls back to PostgreSQL. A ready filter negative returns available; a positive is verified by PostgreSQL.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#526579"/></marker></defs><rect width="960" height="500" rx="18" fill="#f5f8fc"/><text x="28" y="39" font-family="Arial" font-size="22" font-weight="700" fill="#172b4d">GET /api/v1/users/availability/:username</text>
<g font-family="Arial" text-anchor="middle"><rect x="360" y="65" width="240" height="52" rx="10" fill="#e4f1ff" stroke="#5b8db8"/><text x="480" y="97" font-size="15" font-weight="700" fill="#17324d">UsersService</text><path d="M480 117V144" stroke="#526579" stroke-width="2" marker-end="url(#ar)"/><path d="M480 148L590 198 480 248 370 198Z" fill="#fff" stroke="#97a9ba"/><text x="480" y="194" font-size="14" font-weight="700" fill="#17324d">Filter ready?</text><text x="480" y="213" font-size="12" fill="#526579">metadata and connection state</text>
<rect x="65" y="278" width="250" height="58" rx="10" fill="#f1f4f7" stroke="#8798a8"/><text x="190" y="303" font-size="14" font-weight="700" fill="#17324d">PostgreSQL lookup</text><text x="190" y="323" font-size="12" fill="#526579">fallback when unavailable / Redis error</text>
<rect x="355" y="278" width="250" height="58" rx="10" fill="#fff0d9" stroke="#d19a42"/><text x="480" y="303" font-size="14" font-weight="700" fill="#815316">Bloom Filter query</text><text x="480" y="323" font-size="12" fill="#715d3b">Redis GETBIT positions</text>
<rect x="645" y="278" width="250" height="58" rx="10" fill="#e4f3ea" stroke="#68a486"/><text x="770" y="303" font-size="14" font-weight="700" fill="#176348">PostgreSQL lookup</text><text x="770" y="323" font-size="12" fill="#3d6553">only if filter says might exist</text>
<rect x="100" y="400" width="240" height="56" rx="10" fill="#e4f3ea" stroke="#68a486"/><text x="220" y="425" font-size="14" font-weight="700" fill="#176348">Database: no row</text><text x="220" y="444" font-size="12" fill="#3d6553">available: true</text>
<rect x="620" y="400" width="240" height="56" rx="10" fill="#fce9e7" stroke="#d18178"/><text x="740" y="425" font-size="14" font-weight="700" fill="#8a3530">Database: row found</text><text x="740" y="444" font-size="12" fill="#8a3530">available: false</text>
<rect x="355" y="397" width="250" height="62" rx="10" fill="#e4f3ea" stroke="#68a486"/><text x="480" y="423" font-size="14" font-weight="700" fill="#176348">Filter says definitely absent</text><text x="480" y="444" font-size="12" fill="#3d6553">available: true (trusted filter only)</text></g>
<g fill="none" stroke="#526579" stroke-width="2" marker-end="url(#ar)"><path d="M405 225L250 272"/><path d="M555 225L480 272"/><path d="M555 220L752 272"/><path d="M190 336L220 394"/><path d="M480 336V390"/><path d="M770 336L740 394"/></g>
<g font-family="Arial" font-size="12" fill="#526579"><text x="300" y="250">No</text><text x="485" y="263">Yes</text><text x="662" y="250">might exist</text><text x="512" y="367">definitely absent</text></g></svg>
