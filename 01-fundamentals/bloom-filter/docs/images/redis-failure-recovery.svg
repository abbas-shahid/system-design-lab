<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
<title id="title">Redis failure and Bloom Filter recovery</title><desc id="desc">During Redis outage, availability checks fall back to PostgreSQL and signup can still persist in PostgreSQL. Redis reconnection alone is not enough; an explicit rebuild from PostgreSQL marks the filter ready.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#526579"/></marker></defs><rect width="960" height="440" rx="18" fill="#f5f8fc"/><text x="28" y="40" font-family="Arial" font-size="22" font-weight="700" fill="#172b4d">Redis outage: safe fallback, then explicit rebuild</text>
<g font-family="Arial" text-anchor="middle"><rect x="35" y="102" width="170" height="80" rx="11" fill="#e4f1ff" stroke="#5b8db8"/><text x="120" y="133" font-size="15" font-weight="700" fill="#17324d">NestJS API</text><text x="120" y="156" font-size="12" fill="#526579">availability / signup</text>
<rect x="285" y="77" width="190" height="76" rx="11" fill="#fce9e7" stroke="#d18178"/><text x="380" y="108" font-size="15" font-weight="700" fill="#8a3530">Redis unavailable</text><text x="380" y="131" font-size="12" fill="#8a3530">filter not trusted</text>
<rect x="285" y="205" width="190" height="76" rx="11" fill="#e4f3ea" stroke="#68a486"/><text x="380" y="236" font-size="15" font-weight="700" fill="#176348">PostgreSQL</text><text x="380" y="259" font-size="12" fill="#3d6553">source of truth</text>
<rect x="540" y="77" width="175" height="76" rx="11" fill="#fff0d9" stroke="#d19a42"/><text x="627" y="108" font-size="15" font-weight="700" fill="#815316">Redis reconnects</text><text x="627" y="131" font-size="12" fill="#715d3b">may be incomplete</text>
<rect x="540" y="205" width="175" height="76" rx="11" fill="#fff" stroke="#97a9ba"/><text x="627" y="236" font-size="15" font-weight="700" fill="#17324d">Explicit rebuild</text><text x="627" y="259" font-size="12" fill="#526579">read PG in batches</text>
<rect x="780" y="137" width="150" height="82" rx="11" fill="#e4f3ea" stroke="#68a486"/><text x="855" y="170" font-size="15" font-weight="700" fill="#176348">Ready filter</text><text x="855" y="193" font-size="12" fill="#3d6553">metadata status ready</text>
<rect x="35" y="327" width="425" height="68" rx="11" fill="#f1f4f7" stroke="#8798a8"/><text x="247" y="355" font-size="14" font-weight="700" fill="#17324d">During outage</text><text x="247" y="378" font-size="12" fill="#526579">availability → PostgreSQL; signup inserts to PostgreSQL first</text>
<rect x="505" y="327" width="425" height="68" rx="11" fill="#fff0d9" stroke="#d19a42"/><text x="717" y="355" font-size="14" font-weight="700" fill="#815316">After reconnect</text><text x="717" y="378" font-size="12" fill="#715d3b">rebuild under coordinated traffic; restart API if its loss flag is set</text></g>
<g fill="none" stroke="#526579" stroke-width="2" marker-end="url(#ar)"><path d="M205 128H277"/><path d="M205 160L277 232"/><path d="M475 115H532"/><path d="M475 244H532"/><path d="M715 243L775 196"/><path d="M715 115L775 159"/><path d="M380 153V198"/></g>
<g font-family="Arial" font-size="12" fill="#526579"><text x="230" y="111">Redis calls fail</text><text x="228" y="207">fallback / durable write</text><text x="717" y="99">reconnect ≠ rebuild</text><text x="725" y="238">rebuild succeeds</text></g></svg>
